appId: com.yourcrush.app
productName: yourcrush
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**/*
  - package.json
  # 新角色创建与 contextLoader 读取的最小模板资源。模板位于 asar 内，
  # 用户角色和设置始终写入 userData，不随安装包发布。
  - crushes/TEMPLATE/.intimate_config
  - crushes/TEMPLATE/CONTEXT.md
  - crushes/TEMPLATE/INTIMATE_KNOWLEDGE.md
  - crushes/TEMPLATE/WEEKDAY.md
  - crushes/TEMPLATE/memory.md
  - crushes/TEMPLATE/persona.md
  - crushes/TEMPLATE/meta.json
  - crushes/TEMPLATE/PROMPT.md
  - '!crushes/TEMPLATE/SKILL.md'
  - '!settings.json'
npmRebuild: true
forceCodeSigning: false
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  # Local/unsigned builds remain usable without credentials. The protected
  # scripts/release/package.mjs signed mode overrides this and verifies both EXEs.
  signAndEditExecutable: false
  target:
    - nsis
mac:
  notarize: false
  target:
    - dmg
linux:
  target:
    - AppImage
