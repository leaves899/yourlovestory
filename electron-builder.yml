appId: com.yourcrush.app
productName: yourcrush
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
npmRebuild: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  target:
    - nsis
  icon: build/icon.ico
mac:
  target:
    - dmg
  icon: build/icon.icns
linux:
  target:
    - AppImage
  icon: build/icon.png
