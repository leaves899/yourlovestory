name: Release draft

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Signing mode (all outputs remain draft prereleases)
        type: choice
        required: true
        default: unsigned-prerelease
        options:
          - unsigned-prerelease
          - signed-prerelease

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      signing_mode: ${{ inputs.signing_mode }}
      signing_environment_verified: ${{ steps.signing-environment.outcome == 'success' }}
    steps:
      - name: Enforce protected release branch
        if: github.ref != 'refs/heads/master'
        shell: bash
        run: |
          echo "::error::Release drafts may only be created from master."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan release commit and history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify existing signing environment protection
        id: signing-environment
        if: inputs.signing_mode == 'signed-prerelease'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/check-environment.mjs

      - run: npm ci
      - run: npm run check:version
      - run: npm run test:release
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p tsconfig.main.json
      - run: npm test -- --runInBand
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run renderer E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Read and gate package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [[ "$VERSION" != *-* ]]; then
            echo "::error::Public Stable release is not authorized. Select a validated prerelease version."
            exit 1
          fi
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG already points to $TAG_COMMIT instead of release commit $GITHUB_SHA."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"

  package_unsigned:
    name: Unsigned package (${{ matrix.os }})
    needs: quality
    if: inputs.signing_mode == 'unsigned-prerelease'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            smoke: npm run test:packaged
            artifact: windows
          - os: macos-latest
            smoke: npm run test:packaged
            artifact: macos
          - os: ubuntu-latest
            smoke: xvfb-run --auto-servernum npm run test:packaged
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Package with signing explicitly disabled
        run: node scripts/release/package.mjs unsigned-prerelease

      - name: Run packaged Electron smoke gate
        run: ${{ matrix.smoke }}

      - name: Bind smoke evidence to the final installer
        run: node scripts/release/finalize-platform.mjs

      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ matrix.artifact }}
          path: |
            test-results/packaged-smoke/**
            release/signing/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ needs.quality.outputs.version }}-${{ matrix.artifact }}
          path: release/upload/**
          if-no-files-found: error

  package_signed:
    name: Signed package (${{ matrix.os }})
    needs: quality
    if: inputs.signing_mode == 'signed-prerelease'
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            smoke: npm run test:packaged
            artifact: windows
          - os: macos-latest
            smoke: npm run test:packaged
            artifact: macos
          - os: ubuntu-latest
            smoke: xvfb-run --auto-servernum npm run test:packaged
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package and verify signing and notarization
        env:
          RELEASE_SIGNING_ENVIRONMENT_VERIFIED: ${{ needs.quality.outputs.signing_environment_verified }}
          WINDOWS_CSC_LINK: ${{ matrix.artifact == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ matrix.artifact == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          MAC_CSC_LINK: ${{ matrix.artifact == 'macos' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ matrix.artifact == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_BASE64: ${{ matrix.artifact == 'macos' && secrets.APPLE_API_KEY_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.artifact == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.artifact == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ matrix.artifact == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: node scripts/release/package.mjs signed-prerelease

      - name: Run packaged Electron smoke gate
        run: ${{ matrix.smoke }}

      - name: Bind smoke evidence to the final installer
        run: node scripts/release/finalize-platform.mjs

      - name: Upload redacted signing and packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ matrix.artifact }}
          path: |
            test-results/packaged-smoke/**
            release/signing/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ needs.quality.outputs.version }}-${{ matrix.artifact }}
          path: release/upload/**
          if-no-files-found: error

  draft-release:
    name: Create draft prerelease
    needs: [quality, package_unsigned, package_signed]
    if: >-
      ${{ always() && needs.quality.result == 'success' &&
        ((needs.package_unsigned.result == 'success' && needs.package_signed.result == 'skipped') ||
         (needs.package_signed.result == 'success' && needs.package_unsigned.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: release-files-${{ needs.quality.outputs.version }}-*
          path: release-download
          merge-multiple: false

      - name: Verify three platform reports and collect final artifacts
        env:
          RELEASE_MODE: ${{ needs.quality.outputs.signing_mode }}
        run: node scripts/release/collect-artifacts.mjs release-download release-artifacts "$RELEASE_MODE"

      - name: Create draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --draft \
            --prerelease
