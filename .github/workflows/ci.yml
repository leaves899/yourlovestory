name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hard-coded timeline
        run: |
          grep -rE "Day [0-9]" src --include="*.ts" --include="*.tsx" && exit 1 || exit 0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.main.json
      - name: Cleanup test data
        if: always()
        run: |
          find crushes -maxdepth 1 -name 'smoke_*' -type d -exec rm -rf {} + 2>/dev/null || true

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs markdown format
        run: |
          for f in docs/*.md; do
            if [ -f "$f" ]; then
              # Check for empty title lines
              grep -qE "^#\s*$" "$f" && echo "Empty title in $f" && exit 1 || true
              # Check for trailing whitespace
              grep -qE "\s+$" "$f" && echo "Trailing whitespace in $f" && exit 1 || true
            fi
          done
      - name: Check README.md structure
        run: |
          if [ -f README.md ]; then
            grep -qE "^#\s+" README.md || (echo "README missing title" && exit 1)
            grep -qE "^##\s+" README.md || (echo "README missing sections" && exit 1)
          fi
