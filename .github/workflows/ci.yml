name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for private info
        run: |
          grep -r "小明" . --include="*.py" --include="*.md" --include="*.yml" && exit 1 || exit 0
          grep -r "xiaoming" . --include="*.py" --include="*.md" --include="*.yml" && exit 1 || exit 0
          grep -r "李薇" . --include="*.py" --include="*.md" --include="*.yml" && exit 1 || exit 0
          grep -rE "Day [0-9]" . --include="*.py" --include="*.md" --include="*.yml" && exit 1 || exit 0
      - name: Python syntax check
        run: |
          find . -name "*.py" -exec python -m py_compile {} \;

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run CLI contract tests
        run: npm run test:cli
      - name: Cleanup test data
        if: always()
        run: |
          find crushes -maxdepth 1 -name 'smoke_*' -type d -exec rm -rf {} + 2>/dev/null || true

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install pytest
        run: pip install pytest
      - name: Run Python unit tests
        run: pytest tests/unit/ -v
      - name: Run Python integration tests
        run: pytest tests/integration/ -v

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs markdown format
        run: |
          for f in docs/*.md; do
            if [ -f "$f" ]; then
              # Check for empty title lines
              grep -qE "^#\s*$" "$f" && echo "Empty title in $f" && exit 1 || true
              # Check for trailing whitespace
              grep -qE "\s+$" "$f" && echo "Trailing whitespace in $f" && exit 1 || true
            fi
          done
      - name: Check README.md structure
        run: |
          if [ -f README.md ]; then
            grep -qE "^#\s+" README.md || (echo "README missing title" && exit 1)
            grep -qE "^##\s+" README.md || (echo "README missing sections" && exit 1)
          fi