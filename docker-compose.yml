version: '3.8'

services:
  yourcrush:
    build: .
    container_name: yourcrush
    volumes:
      # Mount local crushes directory for persistence
      - ./crushes:/app/crushes
      # Mount configs
      - ./crushes/TEMPLATE:/app/crushes/TEMPLATE:ro
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    networks:
      - yourcrush-net

  # Optional: Local LLM for offline mode
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: yourcrush-ollama
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   networks:
  #     - yourcrush-net
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

networks:
  yourcrush-net:
    driver: bridge

